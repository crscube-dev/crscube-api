        허용 값은 내부 `TrackerStatus` enum 을 따릅니다.
    TrackerPdType:
      type: string
      description: |
        PD/PV 유형. Sync(PUT) 로 저장할 때 서버가 `SUBJECT` 로 고정하며,
        조회 시 `pdpvTypes` 로 필터링할 수 있습니다.
    ExternalMvrPaginatedRow:
      type: object
      description: |
        MVR(Monitoring Visit Report) 목록 행.

        `teamName` 은 `teamId` 가 있으면 `[teamId] teamName` 형태로 조합해 내려갑니다.
      required:
        - teamName
        - mvrType
        - reportNo
        - approvalStatus
        - approvalStatusLabel
        - deleted
        - 'no'
      properties:
        teamId:
          type: string
          nullable: true
        teamTempId:
          type: string
          nullable: true
        teamName:
          type: string
          description: '`teamId` 가 있으면 `[teamId] 팀명` 으로 조합됩니다.'
          example: '[1Z] Seoul Clinical Center'
        teamEngName:
          type: string
          nullable: true
        mvrType:
          type: string
          description: MVR 유형 코드. `/mvr-types` 로 조회한 코드 값입니다.
        reportNo:
          type: integer
          format: int64
        plannedDate:
          type: string
          format: date
          nullable: true
        visitDate:
          type: string
          nullable: true
        approvalLevel:
          type: integer
          format: int64
          nullable: true
        approvalStatus:
          type: string
          description: 승인 상태 코드(`statusLabel`).
        approvalStatusLabel:
          type: string
          description: 표시용 승인 상태 문자열.
        approvalInitialSignatures:
          type: array
          nullable: true
          description: 최초 승인 서명 목록.
          items:
            $ref: '#/components/schemas/ExternalApprovalSignature'
        approvalLastSignatures:
          type: array
          nullable: true
          description: 최종 승인 서명 목록.
          items:
            $ref: '#/components/schemas/ExternalApprovalSignature'
        cras:
          type: array
          nullable: true
          description: 담당 CRA 목록.
          items:
            $ref: '#/components/schemas/ExternalCraInfo'
        deleted:
          type: boolean
        'no':
          type: integer
          format: int64
    ExternalApprovalSignature:
      type: object
      description: |
        승인 서명. `signedByDisplay` 는 `userName`·`userEmail` 이 모두 있을 때만
        `"이름 (이메일)"` 형태로 채워지는 파생 필드입니다.
      required:
        - approvalLevel
        - approvalDate
      properties:
        approvalLevel:
          type: integer
          format: int64
        approvalLabel:
          type: string
          nullable: true
        approvalDate:
          type: string
          format: date
        overdue:
          type: integer
          format: int32
          nullable: true
          description: 지연 일수.
        userName:
          type: string
          nullable: true
        userEmail:
          type: string
          nullable: true
        signedByDisplay:
          type: string
          nullable: true
          description: '`userName`·`userEmail` 이 모두 있을 때만 채워집니다.'
          example: 홍길동 (gildong@example.com)
    ExternalCraInfo:
      type: object
      required:
        - userEmail
        - userName
      properties:
        userEmail:
          type: string
        userName:
          type: string
    MvrTypeCode:
      type: object
      description: |
        MVR 유형 코드. 코드와 라벨 한 쌍입니다.
      additionalProperties: true
