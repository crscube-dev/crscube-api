openapi: 3.0.3
info:
  title: CTMS External API
  version: 1.1.0
  description: |
    CRScube CTMS 의 External API 명세입니다.

    ## 수록 범위

    `/external/api/v1.1` 로 시작하는 엔드포인트 14개입니다.

    | 태그 | 개수 | 내용 |
    |------|-----:|------|
    | `sync` | 5 | Site·Subject·SAE·PD/PV·SDV 동기화 (PUT) |
    | `tracker` | 4 | SAE·PD/PV·Risk·Issue Tracker 조회 |
    | `project` | 3 | Study 조회, 스폰서 프로젝트 목록, Team 목록 |
    | `mvr` | 2 | MVR 목록, MVR 유형 코드 |

    ## 인증

    Sync 계열(PUT 5개)은 `X-API-Key` 헤더가 필수입니다.
    프로젝트별로 발급되며, 값은 담당자에게 문의하세요.

    ## 상태 코드를 읽는 법

    **이 API 는 분류되지 않은 오류까지 400 으로 응답합니다.** 500 은 사실상
    나오지 않습니다.

    | 상황 | 실제 응답 |
    |------|-----------|
    | 검증 실패·본문 파싱 실패·그 밖의 오류 | **400** |
    | X-API-Key 누락·불일치·미설정 | 401 (`INVALID_REQUEST`) |
    | 권한 없음 | 403 (`FORBIDDEN`) |
    | 프로젝트·스터디·코드 없음 | 404 (`RESOURCE_NOT_FOUND`) |

    401 세 가지 사유의 `errorCode` 가 모두 `INVALID_REQUEST` 로 같습니다.
    구분하려면 `error.debugMessage` 를 봐야 합니다.

    Sync 계열에서 프로젝트를 찾지 못하면 **API Key 검증보다 먼저 404** 가
    발생합니다.

    ## 응답 봉투

    성공·실패 모두 `status`·`responseLanguage` 가 항상 붙습니다.

    ```
    성공  { result, message, status: "success", responseLanguage }
    실패  { error: { errorCode, debugMessage, ...additional }, message,
            status: "fail", responseLanguage }
    ```

    Sync(PUT) 5개는 `result` 가 빈 객체입니다. 처리 건수를 돌려주지 않습니다.

    ## 목록 조회 공통

    - `page` 는 1부터. 1 미만이면 1 로 보정됩니다.
    - `size` 가 서버 상한을 넘으면 **오류 없이** 상한값으로 보정됩니다.
    - 응답 `result` 에 `filteredElements` 로 적용된 검색 조건이 되돌아옵니다.
    - 모든 행에 `deleted`·`no` 가 붙습니다.

    ---

    Copyright (c) CRScube Co., Ltd. All Rights Reserved
  contact:
    name: CRScube
    url: https://crscube.io
  license:
    name: Proprietary
    url: https://github.com/crscube-dev/crscube-api#license
servers:
  - url: '{scheme}://{host}'
    description: |
      CTMS API 호스트. 리전·환경별 주소는 담당자에게 확인하세요.
    variables:
      scheme:
        default: https
        enum:
          - https
          - http
      host:
        default: ctms.example.com
security: []
tags:
  - name: sync
    description: |
      외부 시스템 → CTMS 데이터 동기화 (PUT). **`X-API-Key` 필수.**
      요청 목록은 엔드포인트마다 최대 100건이며, 감사 사유는 시스템 동기화로
      기록됩니다.
  - name: tracker
    description: |
      SAE·PD/PV·Risk·Issue Tracker 조회.
  - name: project
    description: Project·Team 조회.
  - name: mvr
    description: MVR(Monitoring Visit Report) 조회.
paths:
  /external/api/v1.1/projects/{projectId}/sites:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ApiKey'
    put:
      tags:
        - sync
      operationId: saveSites
      summary: Site(Team) 동기화
      description: |
        프로젝트의 Site(Team) 목록을 생성·갱신합니다. 한 번에 최대 100건입니다.

        `studyTeamKey` 가 0 보다 크면 이미 동기화된 팀으로 간주합니다.
        감사 사유는 시스템 동기화로 기록됩니다.
      security:
        - externalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSiteSaveRequest'
            example:
              sites:
                - studyTeamKey: 1001
                  teamTempId: TMP-1Z
                  teamName: Seoul Clinical Center
                  teamEngName: Seoul Clinical Center
                  nationCode: KR
                  timeZone: Asia/Seoul
                  piName: 홍길동
                  piEmail: gildong@example.com
                  description: ''
      responses:
        '200':
          $ref: '#/components/responses/_unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /external/api/v1.1/projects/{projectId}/sites/{siteId}/subjects:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/ApiKey'
    put:
      tags:
        - sync
      operationId: saveSubjects
      summary: 시험대상자 동기화
      description: |
        Site 의 시험대상자 목록을 생성·갱신합니다. 한 번에 최대 100건입니다.

        다섯 Sync 요청 중 유일하게 각 항목을 개별 검증합니다
        (`screeningNo` 공백 여부 포함).
      security:
        - externalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSubjectSaveRequest'
            example:
              subjects:
                - studyTeamKey: 1001
                  studySubjectKey: 90112
                  screeningNo: S-1Z-001
                  age: 42
                  gender: FEMALE
                  screeningDate: '2026-07-15'
                  randomNo: R-001
                  randomDate: '2026-07-20'
                  lastVisitDate: '2026-08-01'
                  status: ONGOING
                  deleted: false
      responses:
        '200':
          $ref: '#/components/responses/_unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /external/api/v1.1/projects/{projectId}/sites/{siteId}/subjects/{studySubjectKey}/saes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/StudySubjectKey'
      - $ref: '#/components/parameters/ApiKey'
    put:
      tags:
        - sync
      operationId: saveSaes
      summary: SAE 동기화
      description: |
        시험대상자의 SAE(중대이상반응) 목록을 생성·갱신합니다.
        한 번에 최대 100건입니다.

        날짜 필드는 불명확한 날짜 표기를 문자열로 보낼 수 있습니다.
        공백 문자열은 null 로 처리됩니다.
        `report` 일자와 `comment`, `followUpCompleted` 는 서버가 null 로 고정합니다.
      security:
        - externalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSaeSaveRequest'
            example:
              saes:
                - sequenceNo: '1'
                  studySubjectKey: 90112
                  aeTerm: Headache
                  startDate: '2026-07-01'
                  severity: MILD
                  seriousness: SERIOUS
                  outcome: RECOVERED
                  deleted: false
      responses:
        '200':
          $ref: '#/components/responses/_unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /external/api/v1.1/projects/{projectId}/sites/{siteId}/subjects/{studySubjectKey}/pdpvs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/StudySubjectKey'
      - $ref: '#/components/parameters/ApiKey'
    put:
      tags:
        - sync
      operationId: savePdpvs
      summary: PD/PV 동기화
      description: |
        시험대상자의 PD(Protocol Deviation)/PV 목록을 생성·갱신합니다.
        한 번에 최대 100건입니다.

        서버가 유형을 `SUBJECT` 로 고정하고 `customValues` 는 빈 목록으로
        처리합니다. 날짜 문자열은 파싱 실패 시 예외가 아니라 null 이 됩니다.
      security:
        - externalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalPdpvSaveRequest'
            example:
              pdpvs:
                - queryKey: 5001
                  studyTeamKey: 1001
                  studySubjectKey: 90112
                  studyInstanceKey: 7001
                  pdCode: PD-01
                  pdDetails: Visit window deviation
                  pdStatus: OPEN
                  identifiedDate: '2026-07-10'
                  visitLabel: V1
                  deleted: false
      responses:
        '200':
          $ref: '#/components/responses/_unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /external/api/v1.1/projects/{projectId}/sites/{siteId}/subjects/{studySubjectKey}/sdvs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/StudySubjectKey'
      - $ref: '#/components/parameters/ApiKey'
    put:
      tags:
        - sync
      operationId: saveSdvs
      summary: SDV 동기화
      description: |
        시험대상자의 SDV(Source Data Verification) 진행 상태를 생성·갱신합니다.
        한 번에 최대 100건입니다.

        다른 Sync 요청과 달리 항목의 필수 필드가 `deleted` 하나뿐입니다.
      security:
        - externalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSdvSaveRequest'
            example:
              sdvs:
                - visitLabel: V1
                  scheduleLabel: Screening
                  crfLabel: Demographics
                  status: COMPLETED
                  firstSdvDate: '2026-07-20'
                  lastSdvDate: '2026-07-25'
                  deleted: false
      responses:
        '200':
          $ref: '#/components/responses/_unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /external/api/v1.1/projects/{projectId}/trackers/saes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - tracker
      operationId: paginateTrackerSaes
      summary: SAE Tracker 목록 조회
      description: |
        프로젝트의 SAE Tracker 를 페이지 단위로 조회합니다.

        기본 정렬은 팀명 → 스크리닝번호 → 리포트유형 → 시퀀스 → 후속조치번호
        오름차순입니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/ShowDeleted'
        - $ref: '#/components/parameters/teamKeys'
        - name: screeningNo
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: randomNo
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: sequenceNo
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: aeTerm
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: followUpStatus
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: outcome
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: severity
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: relatedness
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: actionTaken
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: expectedness
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: seriousness
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: detail
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: reportType
          in: query
          required: false
          schema:
            type: string
          description: 숫자 범위 검색
        - name: startDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: endDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: received
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: irb
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: regulatory
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: report
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: inputTime
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - $ref: '#/components/parameters/followUpCompleted'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: 조회 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /external/api/v1.1/projects/{projectId}/trackers/pdpvs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - tracker
      operationId: paginateTrackerPdpvs
      summary: PD/PV Tracker 목록 조회
      description: |
        프로젝트의 PD/PV Tracker 를 페이지 단위로 조회합니다.

        `pdStatus` 는 코드값과 기타 입력을 함께 받는 필터입니다.

        기본 정렬은 팀 ID → 스크리닝번호 → 입력시각 내림차순 → 키 내림차순입니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/ShowDeleted'
        - $ref: '#/components/parameters/teamKeys'
        - name: sequenceNo
          in: query
          required: false
          schema:
            type: string
          description: 숫자 범위 검색
        - name: screeningNo
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: randomNo
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: visit
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: pdCode
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: pdDetails
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: capa
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: comment
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: pdStatus
          in: query
          required: false
          description: |
            PD 상태 필터. 코드값과 기타 입력을 함께 받습니다.
          schema:
            type: string
        - name: pdpvTypes
          in: query
          required: false
          description: PD/PV 유형 필터. 복수 지정 가능.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TrackerPdType'
          style: form
          explode: true
        - name: startDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: reportedDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: endDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: completeDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: irbSubmissionDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: inputTime
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: studyContinued
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: 조회 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpvResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /external/api/v1.1/projects/{projectId}/trackers/risks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - tracker
      operationId: paginateTrackerRisks
      summary: Risk Tracker 목록 조회
      description: |
        프로젝트의 Risk Tracker 를 페이지 단위로 조회합니다.
        기본 정렬은 키 내림차순입니다.

        다른 Tracker 와 달리 팀 단위 필터(`teamKeys`)가 없습니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/ShowDeleted'
        - name: riskNo
          in: query
          required: false
          schema:
            type: string
          description: 숫자 범위 검색
        - name: riskLevel
          in: query
          required: false
          schema:
            type: string
          description: 숫자 범위 검색
        - name: actionPlan
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: actionOwner
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: riskOwner
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: identifiedDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: dueDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: reviewDate
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - name: inputTime
          in: query
          required: false
          schema:
            type: string
          description: 기간 범위 검색
        - $ref: '#/components/parameters/riskCategoryKeys'
        - $ref: '#/components/parameters/riskResponseStrategyKeys'
        - $ref: '#/components/parameters/actionPlanStatusKeys'
