          in: query
          required: false
          schema:
            type: string
        - name: teamName
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: |
            정렬 조건. 기본값 `TEAM_ID_ASC`.
          schema:
