  /external/api/v1.1/projects/{projectId}/mvrs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - mvr
      operationId: paginateMvrs
      summary: MVR 목록 조회
      description: |
        프로젝트의 MVR(Monitoring Visit Report)을 페이지 단위로 조회합니다.

        기본 정렬은 팀 ID → 리포트번호 → 스케줄키 오름차순입니다.
        지연(overdue) 판정 기준은 `overdueCondition` 기본값 `LAST_SIGN` 을 따릅니다.

        `now` 는 기본값이 서버의 오늘 날짜이며 지연 계산 기준일로 쓰입니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/ShowDeleted'
        - name: teamKeys
          in: query
          required: false
          description: 팀 키 필터.
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
        - name: realTeam
          in: query
          required: false
          description: 실제 팀만 조회할지 여부.
          schema:
            type: boolean
            default: true
        - name: overdueCondition
          in: query
          required: false
          description: 지연 판정 기준.
          schema:
            $ref: '#/components/schemas/MvrOverdueCondition'
        - name: overdue
          in: query
          required: false
          description: 지연 여부 필터.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: approvalStatusValues
          in: query
          required: false
          description: 승인 상태 필터.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: reportNo
          in: query
          required: false
          description: 리포트 번호 범위 검색.
          schema:
            type: string
        - name: visitDate
          in: query
          required: false
          description: 방문일 기간 검색.
          schema:
            type: string
        - name: inputTime
          in: query
          required: false
          description: 입력일 기간 검색.
          schema:
            type: string
        - name: now
          in: query
          required: false
          description: 지연 계산 기준일. 기본값은 서버의 오늘 날짜입니다.
          schema:
            type: string
            format: date
        - name: sort
          in: query
          required: false
          description: |
            정렬 조건. 허용 값은 다음과 같습니다 —
            `TEAM_ID_ASC`/`DESC`, `REPORT_NO_ASC`/`DESC`,
            `PLANNED_DATE_ASC`/`DESC`, `CL_DATE_ASC`/`DESC`,
            `FU_DATE_ASC`/`DESC`, `VISIT_DATE_ASC`/`DESC`,
            `VISIT_COUNT_ASC`/`DESC`.
          schema:
            type: array
            items:
              type: string
              enum:
                - TEAM_ID_ASC
                - TEAM_ID_DESC
                - REPORT_NO_ASC
                - REPORT_NO_DESC
                - PLANNED_DATE_ASC
                - PLANNED_DATE_DESC
                - CL_DATE_ASC
                - CL_DATE_DESC
                - FU_DATE_ASC
                - FU_DATE_DESC
                - VISIT_DATE_ASC
                - VISIT_DATE_DESC
                - VISIT_COUNT_ASC
                - VISIT_COUNT_DESC
          style: form
          explode: true
      responses:
        '200':
          description: 조회 성공.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - result
                    properties:
                      result:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedResult'
                          - type: object
                            properties:
                              contents:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ExternalMvrPaginatedRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /external/api/v1.1/projects/{projectId}/mvr-types:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - mvr
      operationId: retrieveMvrTypes
      summary: MVR 유형 코드 조회
      description: |
        프로젝트에서 사용하는 MVR 유형 코드 목록을 조회합니다.
        `/mvrs` 응답의 `mvrType` 값과 대응합니다.

        프로젝트를 찾지 못하면 404(`RESOURCE_NOT_FOUND`)입니다.

        목록 조회이지만 페이지네이션이 없어 `result` 가 배열입니다.
      responses:
        '200':
          description: 조회 성공.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - result
                    properties:
                      result:
                        type: array
                        items:
                          $ref: '#/components/schemas/MvrTypeCode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    externalApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Sync(PUT) 전용 API Key.
        프로젝트별로 발급되며, 값은 담당자에게 문의하세요.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: |
        Project ID. Sync 계열(PUT)에서는 API Key 가 등록된 프로젝트를 식별하는
        키이기도 합니다.
      schema:
        type: string
      example: SAMPLE-PROJECT
    SiteId:
      name: siteId
      in: path
      required: true
      description: Site(Team) ID.
      schema:
        type: string
      example: 1Z
    StudySubjectKey:
      name: studySubjectKey
      in: path
      required: true
      description: 연동 원천(EDC)의 시험대상자 키.
      schema:
        type: integer
        format: int64
      example: 90112
    SponsorId:
      name: sponsorId
      in: path
      required: true
      description: Sponsor ID.
      schema:
        type: string
      example: CRSCUBE
    StudyId:
      name: studyId
      in: path
      required: true
      description: 연동 원천 시스템의 Study ID.
      schema:
        type: string
      example: SAMPLE_STUDY
    ApiKey:
      name: X-API-Key
      in: header
      required: true
      description: |
        Sync 계열(PUT) 전용 API Key.

        프로젝트에 발급된 API Key 와 대조합니다.

        - 헤더가 없거나 공백이면 401 (`INVALID_REQUEST`, "Missing X-API-Key header")
        - 프로젝트에 API Key 가 설정되지 않았으면 401 ("API Key not configured for this study")
        - 값이 다르면 401 ("Invalid API Key")
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: 페이지 번호. 1 부터 시작하며 1 미만이면 1 로 보정됩니다.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: |
        페이지당 행 수. 서버 상한(`REQUEST_MAX_SIZE`)을 넘기면 상한값으로
        조용히 보정됩니다(오류가 아닙니다).
      schema:
        type: integer
        format: int32
        default: 10
    ShowDeleted:
      name: showDeleted
      in: query
      required: false
      description: 삭제된 행 포함 여부.
      schema:
        type: boolean
        default: false
    SourceSystem:
      name: sourceSystem
      in: query
      required: true
      description: |
        연동 원천 시스템. enum 바인딩이므로 정의되지 않은 값을 주면 400 입니다.
      schema:
        $ref: '#/components/schemas/SourceSystem'
    teamKeys:
      name: teamKeys
      in: query
      required: false
      description: |
        팀 키 필터. 비우면 접근 권한이 있는 팀 전체를 조회합니다.
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    followUpCompleted:
      name: followUpCompleted
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    status:
      name: status
      in: query
      required: false
      description: '`TrackerStatus` 목록.'
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TrackerStatus'
      style: form
      explode: true
    sort:
      name: sort
      in: query
      required: false
      description: |
        정렬 조건. 사용 가능한 값은 담당자에게 확인하세요.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    riskCategoryKeys:
      name: riskCategoryKeys
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    riskResponseStrategyKeys:
      name: riskResponseStrategyKeys
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    actionPlanStatusKeys:
      name: actionPlanStatusKeys
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    riskStatusKeys:
      name: riskStatusKeys
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    riskAcceptanceKeys:
      name: riskAcceptanceKeys
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
  responses:
    BadRequest:
      description: |
        요청 오류.

        **이 API 는 분류되지 않은 오류까지 400 으로 응답합니다.**
        따라서 500 은 거의 나오지 않습니다.

        | errorCode | 발생 사유 |
        |-----------|-----------|
        | `REQUIRED_PARAMETER` | 필수 값 누락 (`teamTempId`, `teamName`, `screeningNo`) |
        | `INVALID_PARAMETER` | 본문 파싱 실패, enum 바인딩 실패, 타입 불일치 |
        | `INVALID_REQUEST` | 목록 100건 초과 등 검증 실패 |
        | `UNEXPECTED` | 분류되지 않은 예외 |

        검증 실패 필드는 `error.fieldName` 에 담길 수 있습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FailResponse'
          examples:
            requiredParameter:
              summary: 필수 필드 누락
              value:
                error:
                  errorCode: REQUIRED_PARAMETER
                  debugMessage: EXCEPTION.REQUIRED_PARAMETER
                  fieldName: teamName
                message: 필수 항목이 누락되었습니다.
                status: fail
                responseLanguage: KO
            listSizeExceeded:
              summary: 목록 100건 초과
              value:
                error:
                  errorCode: INVALID_REQUEST
                  debugMessage: Request list size must not exceed 100
                message: Request list size must not exceed 100
                status: fail
                responseLanguage: EN
    Unauthorized:
      description: |
        API Key 검증 실패. **Sync(PUT) 계열에서만 발생합니다.**

        세 경우 모두 `errorCode` 가 `INVALID_REQUEST` 이므로 `debugMessage` 로만
        원인을 구분할 수 있습니다.

        | debugMessage | 사유 |
        |--------------|------|
        | `Missing X-API-Key header` | 헤더가 없거나 공백 |
        | `API Key not configured for this study` | 프로젝트에 API Key 미설정 |
        | `Invalid API Key` | 값 불일치 |

        값 비교는 타이밍 공격에 안전한 방식으로 수행합니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FailResponse'
          example:
            error:
              errorCode: INVALID_REQUEST
              debugMessage: Invalid API Key
            message: 잘못된 요청입니다.
            status: fail
            responseLanguage: KO
    Forbidden:
      description: |
        권한 없음.

        조회 계열에서 권한 검사에 걸리면 발생할 수 있습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FailResponse'
          example:
            error:
              errorCode: FORBIDDEN
              debugMessage: No privilege
            message: 권한이 없습니다.
            status: fail
            responseLanguage: KO
    NotFound:
      description: |
        대상 리소스를 찾을 수 없습니다.

        | 엔드포인트 | 사유 |
        |------------|------|
        | Sync(PUT) 전체 | 해당 projectId 가 등록되어 있지 않음 |
        | `GET /studies/{studyId}` | study id 또는 study 를 찾지 못함 |
        | `GET /projects/{projectId}/mvr-types` | project id 를 찾지 못함 |

        Sync 계열의 404 는 **API Key 검증보다 먼저** 발생합니다. 즉 잘못된
        projectId 로 호출하면 API Key 가 틀려도 404 가 먼저 나옵니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FailResponse'
          example:
            error:
              errorCode: RESOURCE_NOT_FOUND
              debugMessage: 'Project not found: SAMPLE-PROJECT'
            message: 대상을 찾을 수 없습니다.
            status: fail
            responseLanguage: KO
    _unit:
      description: |
        동기화 성공. `result` 는 빈 객체이며 처리 건수 등의 정보는 돌려주지 않습니다.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                required:
                  - result
                properties:
                  result:
                    type: object
                    description: 빈 객체.
          example:
            result: {}
            message: Request was success
            status: success
            responseLanguage: EN
  schemas:
    SuccessResponse:
      type: object
      description: |
        성공 응답 봉투.
        `status`·`responseLanguage` 는 `Response` 에서 항상 초기화되므로 늘 존재합니다.
      required:
        - result
        - message
        - status
        - responseLanguage
      properties:
        result:
          description: 엔드포인트별 결과. 반환 타입이 `Unit` 이면 빈 객체입니다.
        message:
          type: string
          description: |
            기본값은 메시지 키 `MESSAGE.REQUEST_WAS_SUCCESS` 를 `responseLanguage` 로
            변환한 문자열입니다.
        status:
          type: string
          enum:
            - success
        responseLanguage:
          $ref: '#/components/schemas/SupportLang'
    FailResponse:
      type: object
      description: |
        실패 응답 봉투.
        `error` 맵에는 항상 `errorCode`·`debugMessage` 가 들어가고, 예외가
        `fieldName` 을 지정하면 같은 맵에 병합됩니다.
      required:
        - error
        - message
        - status
        - responseLanguage
      properties:
        error:
          type: object
          required:
            - errorCode
            - debugMessage
          properties:
            errorCode:
              $ref: '#/components/schemas/ErrorCode'
            debugMessage:
              type: string
              description: 개발자용 원문 메시지. 로케일이 적용되지 않습니다.
            fieldName:
              type: string
              description: |
                검증 실패 필드명. 필드를 특정할 수 있을 때만 추가됩니다.
          additionalProperties: true
        message:
          type: string
          description: |
            `responseLanguage` 에 맞춰 변환된 사용자 메시지.
            문구가 바뀔 수 있으니 분기 조건으로 쓰지 마세요.
        status:
          type: string
          enum:
            - fail
        responseLanguage:
          $ref: '#/components/schemas/SupportLang'
    PaginatedResult:
      type: object
      description: |
        목록 조회 결과. 응답 봉투의 `result` 에 그대로 담깁니다.
      required:
        - contents
        - totalPages
        - totalCount
        - isFirst
        - isLast
        - page
        - size
        - isEmpty
        - isFiltered
        - filteredElements
        - additional
      properties:
        contents:
          type: array
          description: 조회 행 목록. 행 스키마는 엔드포인트마다 다릅니다.
          items:
            type: object
        totalPages:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int64
        isFirst:
          type: boolean
        isLast:
          type: boolean
        page:
          type: integer
          format: int32
          description: 1부터 시작합니다.
        size:
          type: integer
          format: int32
        isEmpty:
          type: boolean
        isFiltered:
          type: boolean
          description: 필터 조건이 적용되었는지 여부.
        filteredElements:
          type: object
          description: |
            적용된 검색 조건을 그대로 되돌려 줍니다.
            필드 구성은 엔드포인트마다 다릅니다.
          additionalProperties: true
        additional:
          type: object
          description: 엔드포인트별 부가 정보.
          additionalProperties: true
    PaginatedRow:
      type: object
      description: |
        모든 목록 행에 공통으로 붙는 두 필드입니다.
      required:
        - deleted
        - 'no'
      properties:
        deleted:
          type: boolean
        'no':
          type: integer
          format: int64
          description: 행 번호.
    ErrorCode:
      type: string
      description: |
        오류 코드. 아래는 이 API 에서 관측되는 값입니다.

        | errorCode | HTTP | 발생 지점 |
        |-----------|-----:|-----------|
        | `INVALID_REQUEST` | 401 | X-API-Key 누락·불일치, API Key 미설정 |
        | `RESOURCE_NOT_FOUND` | 404 | 프로젝트·스터디·코드 조회 실패 |
        | `REQUIRED_PARAMETER` | 400 | 필수 값 누락 |
        | `INVALID_PARAMETER` | 400 | 파라미터 형식 오류 |
        | `FORBIDDEN` | 403 | 권한 없음 |
        | `UNEXPECTED` | 400 | 분류되지 않은 예외 |

        여기 없는 값이 나올 수도 있습니다. HTTP 상태로 원인을 구분하지 말고
        `error.errorCode` 로 분기하세요.
      example: RESOURCE_NOT_FOUND
    SupportLang:
      type: string
      description: 응답 메시지 언어.
      enum:
        - EN
        - KO
        - JA
        - ZH
      example: EN
    SourceSystem:
      type: string
      description: 연동 원천 시스템.
      enum:
