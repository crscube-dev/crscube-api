        - name: screeningNo
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: randomNo
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: title
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: details
          in: query
          required: false
          schema:
            type: string
          description: 부분 일치 검색
        - name: actions
